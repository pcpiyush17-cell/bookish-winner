[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-quant"
version = "0.1.0"
description = "A safe, auditable, local-first personal quant trading system."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Piyush Chandra" }]
dependencies = [
    "duckdb>=1.4,<2",
    "kiteconnect>=5.2.1,<6",
    "pydantic>=2.11,<3",
    "pyarrow>=21,<22",
    "polars>=1.32,<2",
    "pyyaml>=6,<7",
    "typer>=0.16,<1",
    "tzdata>=2025.2",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "streamlit>=1.47,<2",
    "plotly>=6.2,<7",
]

[project.scripts]
pq = "personal_quant.cli:app"
pq-api = "personal_quant.api:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6.138,<7",
    "mypy>=1.17,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_quant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=personal_quant --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
